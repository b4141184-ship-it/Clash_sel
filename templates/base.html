
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLASH_SEL | فروشگاه گیمینگ</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;
 color:#fff;
 font-family:Tahoma,Arial,sans-serif;
 background:#100307 url('/static/hero-clash.jpg') center top/cover fixed no-repeat;
}
body:before{
 content:"";
 position:fixed;
 inset:0;
 z-index:-1;
 background:linear-gradient(90deg,rgba(20,0,5,.58),rgba(15,0,5,.78));
}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
.topbar{
 max-width:1250px;
 margin:12px auto;
 padding:14px 20px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 flex-wrap:wrap;
 gap:15px;
 background:rgba(10,0,2,.92);
 border:1px solid #ff2638;
 border-radius:16px;
 box-shadow:0 0 18px #ff152c;
}
.logo{font-size:28px;font-weight:900;font-style:italic}
.logo span{color:#ff2539}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.nav a{
 padding:12px 17px;
 border:1px solid #ff293d;
 border-radius:25px;
 background:#18070b;
 font-weight:bold;
 transition:.2s;
}
.nav a:hover,.btn:hover{
 background:#ff152c;
 box-shadow:0 0 15px #ff152c;
}
.container{max-width:1250px;margin:auto;padding:12px}
.game-hero{
 min-height:340px;
 display:flex;
 align-items:center;
 justify-content:flex-end;
 padding:35px;
 text-align:center;
}
.hero-content{
 max-width:480px;
 padding:25px;
 background:rgba(15,0,4,.72);
 border:1px solid #ff293d;
 border-radius:22px;
 box-shadow:0 0 25px #e90025;
}
.hero-tag{color:#ff5968;font-weight:bold}
.hero-content h1{font-size:55px;margin:15px 0;text-shadow:0 0 15px #ff243b}
.hero-content h1 span{color:#ff243b}
.hero-content h2{font-size:25px}
.hero-content p{font-weight:bold}
.btn{
 display:inline-block;
 background:linear-gradient(#ff3345,#bd0018);
 color:white;
 border:1px solid #ff5360;
 border-radius:12px;
 padding:13px 22px;
 font-weight:bold;
 cursor:pointer;
 box-shadow:0 0 12px #ed142c;
}
.section-title{
 text-align:center;
 padding:15px;
 border-bottom:2px solid #ff243b;
 color:white;
 text-shadow:0 0 10px red;
}
.shop-layout{
 display:grid;
 grid-template-columns:minmax(0,2.2fr) minmax(260px,.9fr);
 gap:20px;
 align-items:start;
}
.products-area,.payment-box{
 background:rgba(12,0,3,.94);
 border:2px solid #ff243b;
 border-radius:22px;
 padding:15px;
 box-shadow:0 0 18px rgba(255,0,35,.55);
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:15px;
}
.card{
 background:linear-gradient(145deg,#25080d,#080306);
 border:1px solid #ff263b;
 border-radius:17px;
 overflow:hidden;
 box-shadow:0 0 10px rgba(255,0,35,.3);
}
.photo{height:165px;background:#18070b}
.photo img{width:100%;height:100%;object-fit:cover}
.product-placeholder{padding:60px 5px;text-align:center;color:#ff5365}
.pad{padding:15px;text-align:center}
.pad h3{color:white}
.pad p{color:#ddd;line-height:1.8}
.price{display:block;color:#ff5365;font-size:19px;margin:12px}
form input{
 display:block;
 width:100%;
 margin:9px 0;
 padding:12px;
 border:1px solid #85202e;
 border-radius:9px;
 background:#10080b;
 color:white;
}
form label{display:block;text-align:right;color:#eee;font-size:13px}
form input[type=file]{font-size:12px}
form .btn{width:100%;margin-top:8px}
.payment-box{text-align:center}
.payment-box h2{color:white;border-bottom:2px solid red;padding-bottom:15px}
.payment-placeholder{
 background:linear-gradient(145deg,#29080e,#100306);
 border:1px solid #ff3348;
 border-radius:15px;
 padding:17px 10px;
 margin:15px 0;
}
.payment-placeholder h3{font-size:21px;color:white;overflow-wrap:anywhere}
.payment-placeholder button{
 background:#d90024;color:white;border:1px solid #ff5667;
 border-radius:9px;padding:12px;cursor:pointer;font-weight:bold;
}
.payment-note{color:#ffdf45;line-height:1.9;font-size:13px}
.features{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin:20px 0;
}
.features div,.rubika-banner{
 text-align:center;
 padding:17px 8px;
 background:rgba(10,0,3,.95);
 border:1px solid #ff263b;
 border-radius:30px;
 box-shadow:0 0 12px rgba(255,0,35,.45);
 font-weight:bold;
}
.rubika-banner{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:15px;
 max-width:430px;
 margin:20px auto;
}
.rubika-icon{font-size:35px}
.rubika-banner b{color:#ff5365}
footer{
 text-align:center;
 padding:20px;
 border-top:2px solid red;
 background:#090205;
 color:#fff;
}
@media(max-width:800px){
 .shop-layout{grid-template-columns:1fr}
 .game-hero{min-height:300px;justify-content:center;padding:15px}
 .hero-content h1{font-size:40px}
 .features{grid-template-columns:repeat(2,1fr)}
 .topbar{justify-content:center}
 .logo{width:100%;text-align:center}
 .nav{justify-content:center}
 .nav a{padding:10px;font-size:12px}
}
</style>
</head>
<body>

<header class="topbar">
 <div class="logo">👑 CLASH<span>_SEL</span></div>
 <nav class="nav">
  <a href="/">⌂ خانه</a>
  <a href="/track">🛒 پیگیری سفارش</a>
  <a href="/#products">▣ محصولات</a>
  <a href="/admin">⚙ پنل مدیریت</a>
 </nav>
</header>

<main class="container">
{% block body %}{% endblock %}
</main>

<footer>👑 CLASH_SEL | فروشگاه گیمینگ 👑</footer>

</body>
</html>
